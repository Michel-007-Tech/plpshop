<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenStyle - Connexion / Inscription</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #009639;
            --primary-dark: #007a2e;
            --accent-gold: #fcd116;
            --accent-red: #ce1126;
            --dark: #1a1a1a;
            --light: #f8f6f3;
            --white: #ffffff;
            --gray-200: #e5e5e5;
            --gray-500: #737373;
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a3a1a 0%, #0d1f0d 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 2rem;
        }

        .auth-container {
            background: var(--white); border-radius: 20px; box-shadow: var(--shadow-lg);
            width: 100%; max-width: 450px; overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white); padding: 2rem; text-align: center;
        }
        .auth-header .logo-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--accent-gold), #e6bc00);
            border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
            color: var(--dark); font-size: 28px; margin-bottom: 1rem;
        }
        .auth-header h2 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 0.5rem; }
        .auth-header p { opacity: 0.9; font-size: 14px; }

        .auth-body { padding: 2rem; }
        .auth-tabs { display: flex; margin-bottom: 2rem; border-bottom: 2px solid var(--gray-200); }
        .auth-tab {
            flex: 1; padding: 1rem; border: none; background: none;
            font-weight: 600; cursor: pointer; transition: var(--transition);
            color: var(--gray-500); font-size: 16px;
        }
        .auth-tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); margin-bottom: -2px; }

        .auth-form { display: none; }
        .auth-form.active { display: block; }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 14px;
            color: var(--dark);
        }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 16px; border: 2px solid var(--gray-200);
            border-radius: var(--radius); font-size: 14px; transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 150, 57, 0.1);
        }
        .password-input { position: relative; }
        .toggle-password {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: var(--gray-500);
        }

        .btn-auth {
            width: 100%; padding: 14px; background: var(--primary);
            color: var(--white); border: none; border-radius: var(--radius);
            font-weight: 700; cursor: pointer; transition: var(--transition);
            text-transform: uppercase; letter-spacing: 1px; font-size: 14px;
        }
        .btn-auth:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn-auth:disabled { opacity: 0.7; cursor: not-allowed; }

        .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 14px; color: var(--gray-500); }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }

        .social-login { margin-top: 1.5rem; text-align: center; }
        .social-login p { margin-bottom: 1rem; color: var(--gray-500); font-size: 14px; }
        .social-buttons { display: flex; gap: 1rem; justify-content: center; }
        .social-btn {
            width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--gray-200);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition); font-size: 20px; background: var(--white);
        }
        .social-btn:hover { background: var(--gray-200); transform: translateY(-2px); }
        .social-btn.google { color: #db4437; }
        .social-btn.facebook { color: #4267B2; }

        .alert {
            padding: 12px; border-radius: var(--radius); margin-bottom: 1rem;
            font-size: 14px; display: none;
        }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #059669; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #dc2626; }

        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: #fff;
            animation: spin 0.8s linear infinite; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .auth-container { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo-icon"><i class="fas fa-star"></i></div>
            <h2>SenStyle</h2>
            <p>Bienvenue sur votre boutique mode</p>
        </div>

        <div class="auth-body">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Connexion</button>
                <button class="auth-tab" onclick="switchTab('register')">Inscription</button>
            </div>

            <div id="alertBox" class="alert"></div>

            <!-- Formulaire de connexion -->
            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required placeholder="exemple@email.com">
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <div class="password-input">
                        <input type="password" id="loginPassword" required placeholder="Votre mot de passe">
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword')"></i>
                    </div>
                </div>
                <div style="text-align: right; margin-bottom: 1rem;">
                    <a href="#" style="color: var(--primary); text-decoration: none; font-size: 14px;" onclick="resetPassword()">Mot de passe oublié ?</a>
                </div>
                <button type="submit" class="btn-auth" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Se connecter
                </button>
                <div class="social-login">
                    <p>Ou connectez-vous avec</p>
                    <div class="social-buttons">
                        <div class="social-btn google" onclick="loginWithGoogle()"><i class="fab fa-google"></i></div>
                        <div class="social-btn facebook" onclick="loginWithFacebook()"><i class="fab fa-facebook-f"></i></div>
                    </div>
                </div>
            </form>

            <!-- Formulaire d'inscription -->
            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" id="regName" required placeholder="Votre nom complet">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required placeholder="votre@email.com">
                </div>
                <div class="form-group">
                    <label>Téléphone</label>
                    <input type="tel" id="regPhone" required placeholder="78 000 00 00">
                </div>
                <div class="form-group">
                    <label>Ville</label>
                    <select id="regCity">
                        <option value="Dakar">Dakar</option>
                        <option value="Thiès">Thiès</option>
                        <option value="Saint-Louis">Saint-Louis</option>
                        <option value="Kaolack">Kaolack</option>
                        <option value="Ziguinchor">Ziguinchor</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <div class="password-input">
                        <input type="password" id="regPassword" required placeholder="Minimum 6 caractères" minlength="6">
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('regPassword')"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirmer le mot de passe</label>
                    <input type="password" id="regConfirmPassword" required placeholder="Confirmez votre mot de passe" minlength="6">
                </div>
                <button type="submit" class="btn-auth" id="registerBtn">
                    <i class="fas fa-user-plus"></i> S'inscrire
                </button>
                <div class="auth-footer">
                    <p>En vous inscrivant, vous acceptez nos <a href="#">conditions d'utilisation</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        // Import Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signInWithPopup,
            GoogleAuthProvider,
            FacebookAuthProvider,
            sendPasswordResetEmail,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getFirestore,
            doc,
            setDoc,
            getDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAL629wDPkDgd06OlzplOQZfvYhgXvj1y4",
            authDomain: "ecommerce-7ae10.firebaseapp.com",
            projectId: "ecommerce-7ae10",
            storageBucket: "ecommerce-7ae10.firebasestorage.app",
            messagingSenderId: "970393666405",
            appId: "1:970393666405:web:2f4a0dd5cfc717d595578c",
            measurementId: "G-QH2JXSPJGY"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Providers
        const googleProvider = new GoogleAuthProvider();
        const facebookProvider = new FacebookAuthProvider();

        // Rendre les fonctions disponibles globalement
        window.switchTab = function(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('.auth-tab:first-child').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelector('.auth-tab:last-child').classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
            hideAlert();
        };

        window.togglePassword = function(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        };

        function showAlert(message, type = 'success') {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            setTimeout(() => alertBox.style.display = 'none', 5000);
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        window.showAlert = showAlert;
        window.hideAlert = hideAlert;

        // Sauvegarder les données utilisateur dans Firestore
        async function saveUserToFirestore(user, additionalData = {}) {
            try {
                const userRef = doc(db, "users", user.uid);
                const userData = {
                    uid: user.uid,
                    email: user.email,
                    displayName: additionalData.name || user.displayName || '',
                    phone: additionalData.phone || '',
                    city: additionalData.city || '',
                    role: 'client',
                    createdAt: serverTimestamp(),
                    lastLogin: serverTimestamp()
                };
                
                await setDoc(userRef, userData, { merge: true });
                return userData;
            } catch (error) {
                console.error("Erreur lors de la sauvegarde des données:", error);
                throw error;
            }
        }

        // Récupérer les données utilisateur depuis Firestore
        async function getUserData(uid) {
            try {
                const userRef = doc(db, "users", uid);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists()) {
                    return userSnap.data();
                }
                return null;
            } catch (error) {
                console.error("Erreur lors de la récupération des données:", error);
                return null;
            }
        }

        // Gestion de la connexion
        window.handleLogin = async function(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            
            // Désactiver le bouton et afficher le chargement
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Connexion...';
            
            try {
                // Connexion avec Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Mettre à jour lastLogin dans Firestore
                const userRef = doc(db, "users", user.uid);
                await setDoc(userRef, { lastLogin: serverTimestamp() }, { merge: true });
                
                // Récupérer les données utilisateur
                const userData = await getUserData(user.uid);
                
                // Stocker les informations utilisateur dans localStorage
                const userInfo = {
                    uid: user.uid,
                    email: user.email,
                    name: userData?.displayName || user.displayName,
                    role: userData?.role || 'client',
                    phone: userData?.phone || '',
                    city: userData?.city || ''
                };
                localStorage.setItem('senstyleCurrentUser', JSON.stringify(userInfo));
                
                showAlert('Connexion réussie ! Redirection...', 'success');
                
                setTimeout(() => {
                    window.location.href = userInfo.role === 'admin' ? 'admin.html' : 'index.html';
                }, 1500);
                
            } catch (error) {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
                
                let errorMessage = 'Une erreur est survenue';
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessage = 'Aucun compte trouvé avec cet email';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'Mot de passe incorrect';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Format d\'email invalide';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'Trop de tentatives. Réessayez plus tard';
                        break;
                    default:
                        errorMessage = error.message;
                }
                showAlert(errorMessage, 'error');
            }
        };

        // Gestion de l'inscription
        window.handleRegister = async function(event) {
            event.preventDefault();
            
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const city = document.getElementById('regCity').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const registerBtn = document.getElementById('registerBtn');
            
            // Validation
            if (password !== confirmPassword) {
                showAlert('Les mots de passe ne correspondent pas', 'error');
                return;
            }
            
            if (password.length < 6) {
                showAlert('Le mot de passe doit contenir au moins 6 caractères', 'error');
                return;
            }
            
            // Désactiver le bouton et afficher le chargement
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="spinner"></span> Inscription...';
            
            try {
                // Créer l'utilisateur avec Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Sauvegarder les données supplémentaires dans Firestore
                const userData = {
                    name: name,
                    phone: phone,
                    city: city
                };
                
                await saveUserToFirestore(user, userData);
                
                // Stocker les informations utilisateur dans localStorage
                const userInfo = {
                    uid: user.uid,
                    email: user.email,
                    name: name,
                    role: 'client',
                    phone: phone,
                    city: city
                };
                localStorage.setItem('senstyleCurrentUser', JSON.stringify(userInfo));
                
                showAlert('Inscription réussie ! Redirection...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
                
            } catch (error) {
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> S\'inscrire';
                
                let errorMessage = 'Une erreur est survenue';
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'Cet email est déjà utilisé';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Format d\'email invalide';
                        break;
                    case 'auth/operation-not-allowed':
                        errorMessage = 'Inscription par email/mot de passe non activée';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'Le mot de passe est trop faible';
                        break;
                    default:
                        errorMessage = error.message;
                }
                showAlert(errorMessage, 'error');
            }
        };

        // Connexion avec Google
        window.loginWithGoogle = async function() {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;
                
                // Vérifier si l'utilisateur existe déjà dans Firestore
                const userData = await getUserData(user.uid);
                
                if (!userData) {
                    // Nouvel utilisateur, sauvegarder dans Firestore
                    await saveUserToFirestore(user, {
                        name: user.displayName,
                        phone: user.phoneNumber || '',
                        city: ''
                    });
                }
                
                const userInfo = {
                    uid: user.uid,
                    email: user.email,
                    name: user.displayName,
                    role: userData?.role || 'client',
                    phone: userData?.phone || '',
                    city: userData?.city || ''
                };
                localStorage.setItem('senstyleCurrentUser', JSON.stringify(userInfo));
                
                showAlert('Connexion Google réussie ! Redirection...', 'success');
                
                setTimeout(() => {
                    window.location.href = userInfo.role === 'admin' ? 'admin.html' : 'index.html';
                }, 1500);
                
            } catch (error) {
                showAlert('Erreur de connexion avec Google: ' + error.message, 'error');
            }
        };

        // Connexion avec Facebook
        window.loginWithFacebook = async function() {
            try {
                const result = await signInWithPopup(auth, facebookProvider);
                const user = result.user;
                
                // Vérifier si l'utilisateur existe déjà dans Firestore
                const userData = await getUserData(user.uid);
                
                if (!userData) {
                    // Nouvel utilisateur, sauvegarder dans Firestore
                    await saveUserToFirestore(user, {
                        name: user.displayName,
                        phone: user.phoneNumber || '',
                        city: ''
                    });
                }
                
                const userInfo = {
                    uid: user.uid,
                    email: user.email,
                    name: user.displayName,
                    role: userData?.role || 'client',
                    phone: userData?.phone || '',
                    city: userData?.city || ''
                };
                localStorage.setItem('senstyleCurrentUser', JSON.stringify(userInfo));
                
                showAlert('Connexion Facebook réussie ! Redirection...', 'success');
                
                setTimeout(() => {
                    window.location.href = userInfo.role === 'admin' ? 'admin.html' : 'index.html';
                }, 1500);
                
            } catch (error) {
                showAlert('Erreur de connexion avec Facebook: ' + error.message, 'error');
            }
        };

        // Réinitialisation du mot de passe
        window.resetPassword = async function() {
            const email = document.getElementById('loginEmail').value;
            
            if (!email) {
                showAlert('Veuillez entrer votre adresse email', 'error');
                return;
            }
            
            try {
                await sendPasswordResetEmail(auth, email);
                showAlert('Email de réinitialisation envoyé ! Vérifiez votre boîte mail.', 'success');
            } catch (error) {
                showAlert('Erreur: ' + error.message, 'error');
            }
        };

        // Vérifier l'état de l'authentification
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // L'utilisateur est connecté
                getUserData(user.uid).then(userData => {
                    const currentPage = window.location.pathname.split('/').pop();
                    if (currentPage === 'auth.html' || currentPage === 'login.html' || currentPage === '') {
                        const userInfo = {
                            uid: user.uid,
                            email: user.email,
                            name: userData?.displayName || user.displayName,
                            role: userData?.role || 'client',
                            phone: userData?.phone || '',
                            city: userData?.city || ''
                        };
                        localStorage.setItem('senstyleCurrentUser', JSON.stringify(userInfo));
                        window.location.href = userInfo.role === 'admin' ? 'admin.html' : 'index.html';
                    }
                });
            }
        });

        console.log('Firebase Auth initialisé avec succès');
    </script>
</body>
</html>
