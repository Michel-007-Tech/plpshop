<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLP Shop | Administration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ... (gardez tout le CSS précédent) ... */
    </style>
</head>
<body>
    <!-- ... (gardez toute la structure HTML précédente) ... -->

    <script>
        // Configuration - STOCKAGE PARTAGÉ AVEC INDEX.HTML
        const ADMIN_EMAIL = 'admin@plpshop.com';
        const ADMIN_PASSWORD = 'PLPShop2026';
        const PRODUCTS_KEY = 'plpshop_products'; // MÊME CLÉ QUE INDEX.HTML
        
        // ============================================================
        // STOCKAGE PARTAGÉ (localStorage simple pour compatibilité)
        // ============================================================
        function getProducts() {
            const products = localStorage.getItem(PRODUCTS_KEY);
            return products ? JSON.parse(products) : [];
        }

        function saveProducts(products) {
            localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products));
            // Déclencher un événement pour informer les autres onglets
            window.dispatchEvent(new CustomEvent('productsUpdated', { 
                detail: products 
            }));
            return true;
        }

        // ============================================================
        // AUTHENTIFICATION
        // ============================================================
        function verifyOwner(e) {
            e.preventDefault();
            const email = document.getElementById('ownerEmail').value.trim();
            const secret = document.getElementById('ownerSecret').value.trim();

            if (email === ADMIN_EMAIL && secret === ADMIN_PASSWORD) {
                document.getElementById('ownerVerifyScreen').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                document.body.classList.add('admin-body');
                sessionStorage.setItem('plpshop_owner_auth', 'true');
                initAdmin();
                showToast('✅ Bienvenue dans l\'administration !', 'success');
            } else {
                const errEl = document.getElementById('ownerError');
                if (!errEl) return;
                errEl.className = 'error-msg show';
                errEl.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Accès refusé.';
                setTimeout(() => {
                    errEl.className = 'error-msg';
                }, 3000);
            }
        }

        function checkExistingSession() {
            if (sessionStorage.getItem('plpshop_owner_auth') === 'true') {
                document.getElementById('ownerVerifyScreen').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                document.body.classList.add('admin-body');
                initAdmin();
            }
        }

        // ============================================================
        // INITIALISATION
        // ============================================================
        function initAdmin() {
            ensureDefaultData();
            loadDashboard();
            loadProductsByCategory();
            loadOrders();
            loadUsers();
            loadSettings();
            
            // Écouter les changements de produits
            window.addEventListener('storage', function(e) {
                if (e.key === PRODUCTS_KEY) {
                    loadProductsByCategory();
                    loadDashboard();
                }
            });
        }

        function ensureDefaultData() {
            if (!localStorage.getItem(PRODUCTS_KEY)) {
                const defaults = [
                    { id: 1, name: "T-shirt Premium Noir", price: 12000, oldPrice: 15000, category: "t-shirt", gender: "homme", image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&h=500&fit=crop", description: "T-shirt en coton bio" },
                    { id: 2, name: "T-shirt Femme Élégant", price: 10000, category: "t-shirt", gender: "femme", image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=400&h=500&fit=crop", description: "Coupe féminine" },
                    { id: 3, name: "Short Sport Homme", price: 15000, oldPrice: 18000, category: "short", gender: "homme", image: "https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=400&h=500&fit=crop", description: "Short de sport respirant" },
                    { id: 4, name: "Maillot PSG Domicile", price: 55000, oldPrice: 70000, category: "maillot", gender: "homme", image: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=400&h=500&fit=crop", description: "Maillot officiel" },
                    { id: 5, name: "Ensemble Sport Homme", price: 45000, oldPrice: 55000, category: "ensemble sport", gender: "homme", image: "https://images.unsplash.com/photo-1518459031867-a89b944bffe4?w=400&h=500&fit=crop", description: "Ensemble jogging" },
                    { id: 6, name: "Basket Nike Air", price: 85000, oldPrice: 100000, category: "chaussures", gender: "homme", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=500&fit=crop", description: "Basket running" }
                ];
                localStorage.setItem(PRODUCTS_KEY, JSON.stringify(defaults));
            }
        }

        // ============================================================
        // FORMATAGE
        // ============================================================
        function formatFCFA(a) {
            return (a || 0).toLocaleString('fr-FR') + ' FCFA';
        }

        // ============================================================
        // IMAGE
        // ============================================================
        function switchImageTab(method) {
            currentImageMethod = method;
            const tabs = document.querySelectorAll('.image-tab');
            const methods = document.querySelectorAll('.upload-method');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            methods.forEach(m => m.classList.remove('active'));
            
            if (method === 'upload') {
                tabs[0].classList.add('active');
                document.getElementById('uploadMethod').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('urlMethod').classList.add('active');
            }
        }

        function resizeImage(dataUrl, maxWidth, maxHeight, quality, callback) {
            const img = new Image();
            img.onload = function() {
                let width = img.width;
                let height = img.height;
                
                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width = Math.round(width * ratio);
                    height = Math.round(height * ratio);
                }
                
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                try {
                    callback(canvas.toDataURL('image/jpeg', quality));
                } catch (err) {
                    callback(dataUrl);
                }
            };
            img.onerror = function() {
                callback(dataUrl);
            };
            img.src = dataUrl;
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
            if (!allowedTypes.includes(file.type)) {
                showToast('Format non supporté. Utilisez JPG, PNG, GIF ou WEBP.', 'error');
                event.target.value = '';
                return;
            }
            
            if (file.size > 5 * 1024 * 1024) {
                showToast('Image trop volumineuse (max 5 Mo).', 'error');
                event.target.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                resizeImage(e.target.result, 800, 800, 0.8, function(resizedDataUrl) {
                    const preview = document.getElementById('imagePreview');
                    const removeBtn = document.getElementById('btnRemoveImage');
                    const dataInput = document.getElementById('uploadedImageData');
                    
                    preview.src = resizedDataUrl;
                    preview.classList.add('show');
                    removeBtn.classList.add('show');
                    dataInput.value = resizedDataUrl;
                    
                    showToast('✅ Image chargée avec succès', 'success');
                });
            };
            reader.readAsDataURL(file);
        }

        function removeUploadedImage() {
            document.getElementById('imagePreview').classList.remove('show');
            document.getElementById('imagePreview').src = '';
            document.getElementById('btnRemoveImage').classList.remove('show');
            document.getElementById('uploadedImageData').value = '';
            document.getElementById('imageFileInput').value = '';
        }

        function getImageData() {
            if (currentImageMethod === 'upload') {
                return document.getElementById('uploadedImageData').value;
            } else {
                return document.getElementById('productImageUrl').value.trim();
            }
        }

        // ============================================================
        // NAVIGATION
        // ============================================================
        function showSection(s) {
            const sections = document.querySelectorAll('.content-section');
            sections.forEach(section => section.style.display = 'none');
            
            const links = document.querySelectorAll('.sidebar-menu a');
            links.forEach(link => link.classList.remove('active'));
            
            const map = {
                dashboard: 'dashboardSection',
                products: 'productsSection',
                orders: 'ordersSection',
                users: 'usersSection',
                settings: 'settingsSection'
            };
            
            const div = document.getElementById(map[s]);
            if (div) div.style.display = 'block';
            
            const titles = {
                dashboard: '📊 Tableau de bord',
                products: '📦 Gestion des produits',
                orders: '🛒 Gestion des commandes',
                users: '👥 Gestion des clients',
                settings: '⚙️ Paramètres'
            };
            
            document.getElementById('sectionTitle').textContent = titles[s] || 'Admin';
            
            if (s === 'dashboard') loadDashboard();
            if (s === 'products') loadProductsByCategory();
            if (s === 'orders') loadOrders();
            if (s === 'users') loadUsers();
        }

        // ============================================================
        // DASHBOARD
        // ============================================================
        function loadDashboard() {
            const products = getProducts();
            const orders = getOrders();
            const users = getUsers();
            
            document.getElementById('totalProducts').textContent = products.length;
            document.getElementById('totalOrders').textContent = orders.length;
            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('productCount').textContent = products.length;
            
            const revenue = orders.reduce((sum, order) => sum + (order.total || 0), 0);
            document.getElementById('totalRevenue').textContent = revenue.toLocaleString('fr-FR') + ' FCFA';
        }

        // ============================================================
        // PRODUCTS
        // ============================================================
        const CATEGORY_KEYS = {
            't-shirt': 'tshirt',
            'short': 'short',
            'maillot': 'maillot',
            'ensemble sport': 'ensemble',
            'chaussures': 'chaussure'
        };

        function loadProductsByCategory() {
            const products = getProducts();
            const categories = ['t-shirt', 'short', 'maillot', 'ensemble sport', 'chaussures'];
            
            categories.forEach(cat => {
                const filtered = products.filter(p => p.category === cat);
                const catKey = CATEGORY_KEYS[cat] || cat.replace(/\s+/g, '');
                const tbody = document.getElementById('table-' + catKey);
                const countEl = document.getElementById('count-' + catKey);
                
                if (countEl) countEl.textContent = filtered.length;
                
                if (tbody) {
                    if (filtered.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:1rem;">Aucun produit</td></tr>';
                    } else {
                        let html = '';
                        filtered.forEach(p => {
                            const gender = p.gender === 'homme' ? '👔 Homme' : p.gender === 'femme' ? '👗 Femme' : '👤 Mixte';
                            html += `
                                <tr>
                                    <td>#${p.id}</td>
                                    <td><img src="${p.image}" style="width:25px;height:25px;object-fit:cover;border-radius:2px;" onerror="this.src='https://via.placeholder.com/25'"></td>
                                    <td>${p.name}</td>
                                    <td>${gender}</td>
                                    <td><strong>${formatFCFA(p.price)}</strong></td>
                                    <td>
                                        <button class="btn-action btn-edit" onclick="editProduct(${p.id})"><i class="fas fa-edit"></i></button>
                                        <button class="btn-action btn-delete" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                            `;
                        });
                        tbody.innerHTML = html;
                    }
                }
            });
        }

        function openProductModalWithCategory(category) {
            preselectedCategory = category;
            openProductModal();
        }

        function openProductModal(productId) {
            const modal = document.getElementById('productModal');
            modal.classList.add('active');
            resetImageForm();
            
            if (productId) {
                document.getElementById('modalTitle').textContent = 'Modifier le produit';
                const products = getProducts();
                const product = products.find(p => p.id === productId);
                
                if (product) {
                    editingProductId = productId;
                    document.getElementById('productId').value = product.id;
                    document.getElementById('productName').value = product.name;
                    document.getElementById('productCategory').value = product.category;
                    document.getElementById('productGender').value = product.gender || 'homme';
                    document.getElementById('productPrice').value = product.price;
                    document.getElementById('productOldPrice').value = product.oldPrice || '';
                    document.getElementById('productDescription').value = product.description || '';
                    
                    if (product.image && product.image.startsWith('data:')) {
                        switchImageTab('upload');
                        document.getElementById('uploadedImageData').value = product.image;
                        const preview = document.getElementById('imagePreview');
                        preview.src = product.image;
                        preview.classList.add('show');
                        document.getElementById('btnRemoveImage').classList.add('show');
                    } else {
                        switchImageTab('url');
                        document.getElementById('productImageUrl').value = product.image || '';
                    }
                }
            } else {
                document.getElementById('modalTitle').textContent = 'Ajouter un produit';
                document.getElementById('productForm').reset();
                document.getElementById('productId').value = '';
                editingProductId = null;
                
                if (preselectedCategory) {
                    document.getElementById('productCategory').value = preselectedCategory;
                    preselectedCategory = null;
                }
                switchImageTab('upload');
            }
        }

        function resetImageForm() {
            document.getElementById('imagePreview').classList.remove('show');
            document.getElementById('imagePreview').src = '';
            document.getElementById('btnRemoveImage').classList.remove('show');
            document.getElementById('uploadedImageData').value = '';
            document.getElementById('productImageUrl').value = '';
            document.getElementById('imageFileInput').value = '';
            switchImageTab('upload');
        }

        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
            resetImageForm();
            preselectedCategory = null;
            editingProductId = null;
        }

        function saveProduct(event) {
            event.preventDefault();
            
            const name = document.getElementById('productName').value.trim();
            const category = document.getElementById('productCategory').value;
            const gender = document.getElementById('productGender').value;
            const price = parseInt(document.getElementById('productPrice').value);
            const oldPrice = document.getElementById('productOldPrice').value ? parseInt(document.getElementById('productOldPrice').value) : null;
            const description = document.getElementById('productDescription').value.trim();
            const imageData = getImageData();
            
            if (!name) {
                showToast('❌ Veuillez entrer un nom de produit.', 'error');
                return;
            }
            if (!price || price <= 0) {
                showToast('❌ Veuillez entrer un prix valide.', 'error');
                return;
            }
            if (!imageData) {
                showToast('❌ Veuillez fournir une image (upload ou URL).', 'error');
                return;
            }
            
            let products = getProducts();
            const productId = document.getElementById('productId').value;
            const isEdit = !!productId;
            
            if (isEdit) {
                const idx = products.findIndex(p => p.id === parseInt(productId));
                if (idx !== -1) {
                    products[idx] = {
                        ...products[idx],
                        name,
                        category,
                        gender,
                        price,
                        oldPrice,
                        description,
                        image: imageData
                    };
                }
            } else {
                products.push({
                    id: Date.now(),
                    name,
                    category,
                    gender,
                    price,
                    oldPrice,
                    description,
                    image: imageData
                });
            }
            
            if (saveProducts(products)) {
                closeModal();
                loadProductsByCategory();
                loadDashboard();
                showToast('✅ Produit ' + (isEdit ? 'modifié' : 'ajouté') + ' avec succès !', 'success');
            }
        }

        function editProduct(id) {
            openProductModal(id);
        }

        function deleteProduct(id) {
            if (!confirm('Supprimer ce produit ?')) return;
            let products = getProducts();
            products = products.filter(p => p.id !== id);
            
            if (saveProducts(products)) {
                loadProductsByCategory();
                loadDashboard();
                showToast('🗑️ Produit supprimé.', 'success');
            }
        }

        // ============================================================
        // ORDERS & USERS (simplifiés)
        // ============================================================
        function getOrders() {
            const data = localStorage.getItem('plpshop_orders');
            return data ? JSON.parse(data) : [];
        }

        function getUsers() {
            const data = localStorage.getItem('plpshop_users');
            if (!data) {
                const defaultUsers = [
                    { id: 1, name: 'Administrateur', email: 'admin@plpshop.com', phone: '779078970', role: 'admin' }
                ];
                localStorage.setItem('plpshop_users', JSON.stringify(defaultUsers));
                return defaultUsers;
            }
            return JSON.parse(data);
        }

        function loadOrders() {
            const orders = getOrders();
            const tbody = document.getElementById('ordersTableBody');
            if (tbody) {
                tbody.innerHTML = orders.length === 0 
                    ? '<tr><td colspan="6" style="text-align:center;padding:2rem;">Aucune commande</td></tr>'
                    : orders.map(o => `
                        <tr>
                            <td><strong>${o.id}</strong></td>
                            <td>${o.customerName}</td>
                            <td>${new Date(o.date).toLocaleDateString('fr-FR')}</td>
                            <td><strong>${formatFCFA(o.total)}</strong></td>
                            <td>${o.status}</td>
                            <td><button class="btn-action btn-view">👁️</button></td>
                        </tr>
                    `).join('');
            }
        }

        function loadUsers() {
            const users = getUsers();
            const tbody = document.getElementById('usersTableBody');
            if (tbody) {
                tbody.innerHTML = users.map(u => `
                    <tr>
                        <td>#${u.id}</td>
                        <td>${u.name}</td>
                        <td>${u.email}</td>
                        <td>${u.phone}</td>
                        <td>${u.role === 'admin' ? 'Admin' : 'Client'}</td>
                    </tr>
                `).join('');
            }
        }

        function loadSettings() {
            const s = JSON.parse(localStorage.getItem('plpshop_settings'));
            if (s) {
                document.getElementById('siteName').value = s.siteName || '';
                document.getElementById('siteEmail').value = s.email || '';
                document.getElementById('sitePhone').value = s.phone || '';
                document.getElementById('siteAddress').value = s.address || '';
                document.getElementById('ownerSecretCode').value = s.ownerSecret || '';
            }
        }

        function saveSettings() {
            const s = {
                siteName: document.getElementById('siteName').value,
                email: document.getElementById('siteEmail').value,
                phone: document.getElementById('sitePhone').value,
                address: document.getElementById('siteAddress').value,
                ownerSecret: document.getElementById('ownerSecretCode').value
            };
            localStorage.setItem('plpshop_settings', JSON.stringify(s));
            showToast('✅ Paramètres enregistrés !', 'success');
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type) {
            type = type || 'success';
            const toast = document.getElementById('toastAdmin');
            toast.textContent = message;
            toast.className = 'toast-admin ' + type;
            void toast.offsetWidth;
            toast.classList.add('show');
            
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // LOGOUT
        // ============================================================
        function logout() {
            if (confirm('Se déconnecter ?')) {
                sessionStorage.removeItem('plpshop_owner_auth');
                window.location.href = 'index.html';
            }
        }

        // ============================================================
        // INITIALISATION
        // ============================================================
        checkExistingSession();
    </script>
</body>
</html>
